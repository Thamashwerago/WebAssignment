<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>touronline</title>
    <link rel="icon" href="img/icon.png" type="image/icon type" />
    <link href="navbar.css" rel="stylesheet" />
    <link href="common.css" rel="stylesheet" />
    <style>
      .navigation {
        display: flex;
        flex-direction: column;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
      }

      .links {
        padding: 10px;
        margin: 10px;
        background-color: rgb(213, 218, 218);
        border-radius: 10px;
        animation: fadein 2s linear normal;
      }

      @keyframes fadein {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      a {
        color: inherit;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>

  <body>
    <header>
      <nav>
        <div class="mobologo">
          <a herf="home" class="logo">touronline</a>
        </div>
        <div id="navsectionmobile">
          <ul class="navbar">
            <li>
              <a href="home" aria-label="Home"
                ><img src="img/home.svg" alt="Home"
              /></a>
            </li>
            <li>
              <a href="explore" aria-label="Explore"
                ><img src="img/explore.svg" alt="Explore"
              /></a>
            </li>
            <li>
              <a href="category" aria-label="Category"
                ><img src="img/category.svg" alt="Category"
              /></a>
            </li>
            <li>
              <a href="search" aria-label="Search"
                ><img src="img/search.svg" alt="Search"
              /></a>
            </li>
            <li>
              <a href="mobo" aria-label="Mobile Menu"
                ><img src="img/expand.svg" alt="Menu"
              /></a>
            </li>
          </ul>
        </div>
      </nav>
    </header>
    <div class="navigation">
      <a href="about">
        <div class="links">About</div>
      </a>
      <a href="aboutdev">
        <div class="links">About Developers</div>
      </a>
      <a href="aboutNSBM">
        <div class="links">About NSBM</div>
      </a>
      <a>
        <div class="links" id="navlogin">Login</div>
      </a>
    </div>
    <script src="navbar.js"></script>
    <script src="log.js"></script>
  </body>
</html>
